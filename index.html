<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Shopping Cart</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav>
        <div class="nav-title">Shopping Cart</div>
        <div id="cart-info">Cart (0)</div>
    </nav>

    <div id="storage-info" class="storage-info-container">
        <!-- Storage information will be displayed here -->
    </div>

    <div class="products-container" id="products">
        <!-- Products will be added here dynamically -->
    </div>

    <div class="cart-container" id="cart">
        <h2>Shopping Cart</h2>
        <div id="cart-items">
            <!-- Cart items will be added here -->
        </div>
        <div id="cart-total">Total: $0</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
